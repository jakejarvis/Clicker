name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "**.md"]
  pull_request:
    paths-ignore: ["site/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Same toolchain as release.yml.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: swift format lint --strict --recursive --parallel Sources Tests Package.swift

      - name: Test
        run: swift test

      - name: Package a universal app
        run: script/package_app.sh --release --universal

      # Zipped with ditto so Sparkle.framework's symlinks survive. docs/development.md
      # points at this when a control looks different locally and in CI.
      - name: Zip the app
        run: ditto -c -k --keepParent dist/Clicker.app dist/Clicker.app.zip

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Clicker.app
          path: dist/Clicker.app.zip
          retention-days: 14

      # Keeps the build without the Sparkle trait compiling. Runs after the
      # upload, since it replaces dist/Clicker.app.
      - name: Package the App Store flavor
        run: script/package_app.sh --release --app-store
