name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "**.md"]
  pull_request:
    paths-ignore: ["site/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Same toolchain as release.yml.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: swift format lint --strict --recursive --parallel Sources Tests Package.swift

      - name: Test
        run: swift test

      - name: Package a universal app
        run: script/package_app.sh --release --universal

      # Keeps the build without the Sparkle trait compiling.
      - name: Package the App Store flavor
        run: script/package_app.sh --release --app-store
