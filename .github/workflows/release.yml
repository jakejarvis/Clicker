# Pushing a vX.Y.Z tag builds a universal, Developer ID-signed and notarized
# Clicker, publishes the DMG and zip as a GitHub release, pushes the Sparkle
# appcast to the gh-pages branch (served at clicker.jarv.is/appcast.xml
# through the Vercel rewrite in site/vercel.json) and redeploys the site so
# its changelog picks up the release. Notes come from the annotated tag's
# message. The publish steps are idempotent, so a failed run can be re-run.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    # Notarization waits up to 45 minutes per submission, and there are two.
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIGNING_IDENTITY: "Developer ID Application: Jake Jarvis (B5ZWKBCUTU)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag filter above is looser than package_app.sh's version check;
      # fail here, before any credentials are imported.
      - name: Check the version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "tag must be vX.Y.Z with minor and patch below 100: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      # actions/checkout can leave the tag lightweight; the notes need its message.
      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      # A tag can land on a commit CI never saw.
      - name: Lint and test
        run: |
          swift format lint --strict --recursive --parallel Sources Tests Package.swift
          swift test

      - name: Import signing credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$ASC_API_KEY_P8" >"$RUNNER_TEMP/AuthKey.p8"
          echo "KEYCHAIN=$KEYCHAIN" >>"$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >>"$GITHUB_ENV"

      - name: Build, sign, notarize and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: script/release.sh --version "${GITHUB_REF_NAME#v}"

      # gh creates a draft, uploads, then publishes, which immutable releases
      # need. A release that is already published (a re-run after a later step
      # failed) is kept, and the appcast is regenerated from its zip: the one
      # this run built is signed differently, and an appcast describing it
      # would make Sparkle reject the published download. A draft left by an
      # interrupted upload is redone.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATE="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$STATE" in
            false)
              echo "Release $GITHUB_REF_NAME is already published; keeping it and describing its zip in the appcast"
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --pattern "Clicker-$VERSION.zip" --dir dist/release --clobber
              script/release.sh --version "$VERSION" --appcast-only
              exit 0
              ;;
            true)
              echo "Replacing the draft release left by an earlier run"
              gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "dist/release/Clicker-$VERSION.dmg" "dist/release/Clicker-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Clicker $VERSION" --notes-file dist/release/notes.md

      # Only after the release is live, so the feed never points at a missing zip.
      - name: Push the appcast to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/gh-pages" FETCH_HEAD
          cp dist/release/appcast.xml "$RUNNER_TEMP/gh-pages/appcast.xml"
          cd "$RUNNER_TEMP/gh-pages"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "Appcast on gh-pages is already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Appcast for $GITHUB_REF_NAME"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      # The site's changelog is built from the GitHub releases API at deploy
      # time, so a deploy hook (Vercel project settings › Git › Deploy Hooks)
      # refreshes it. Optional: without the secret the next push to main does.
      - name: Redeploy the site
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$VERCEL_DEPLOY_HOOK_URL" ]]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set; the changelog refreshes on the next site deploy"
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" >/dev/null
          echo "Site deploy requested"

      # notarytool's log and whatever was built, for reading a rejected
      # submission or a failed verification without re-running the job.
      - name: Keep the release files for debugging
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/release
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
