# Pushing a vX.Y.Z tag builds a universal, Developer ID-signed and notarized
# Clicker, publishes the DMG and zip as a GitHub release, pushes the Sparkle
# appcast to the gh-pages branch (served at clicker.jarv.is/appcast.xml
# through the Vercel rewrite in site/vercel.json), bumps the Homebrew cask in
# jakejarvis/homebrew-tap and redeploys the site so its download button and
# changelog pick up the release. When the App Store secrets are set it also
# uploads the Mac App Store build to App Store Connect (TestFlight; review is
# still submitted by hand). Notes come from the annotated tag's message. The
# publish steps are idempotent, so a failed run can be re-run.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    # Notarization waits up to 45 minutes per submission, and there are two.
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      SIGNING_IDENTITY: "Developer ID Application: Jake Jarvis (B5ZWKBCUTU)"
      APP_STORE_IDENTITY: "Apple Distribution: Jake Jarvis (B5ZWKBCUTU)"
      APP_STORE_INSTALLER_IDENTITY: "3rd Party Mac Developer Installer: Jake Jarvis (B5ZWKBCUTU)"
      # The app's Apple ID in App Store Connect (App Information).
      APP_STORE_APPLE_ID: "6824713472"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag filter above is looser than package_app.sh's version check;
      # fail here, before any credentials are imported.
      - name: Check the version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "tag must be vX.Y.Z with minor and patch below 100: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      # actions/checkout can leave the tag lightweight; the notes need its message.
      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      # release.sh extends the published appcast (every version stays listed)
      # rather than writing a fresh one, so it needs gh-pages before it runs.
      - name: Fetch the published appcast
        run: git fetch origin gh-pages:refs/remotes/origin/gh-pages

      # A tag can land on a commit CI never saw.
      - name: Lint and test
        run: |
          swift format lint --strict --recursive --parallel Sources Tests Package.swift
          swift test

      - name: Import signing credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APP_STORE_P12_BASE64: ${{ secrets.APP_STORE_P12_BASE64 }}
          APP_STORE_P12_PASSWORD: ${{ secrets.APP_STORE_P12_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          # Optional: Apple Distribution and Mac Installer Distribution, for the
          # App Store upload at the end.
          if [[ -n "$APP_STORE_P12_BASE64" ]]; then
            printf '%s' "$APP_STORE_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/app-store.p12"
            security import "$RUNNER_TEMP/app-store.p12" -k "$KEYCHAIN" -f pkcs12 \
              -P "$APP_STORE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/app-store.p12"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$ASC_API_KEY_P8" >"$RUNNER_TEMP/AuthKey.p8"
          echo "KEYCHAIN=$KEYCHAIN" >>"$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >>"$GITHUB_ENV"

      - name: Build, sign, notarize and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: script/release.sh --version "${GITHUB_REF_NAME#v}"

      # gh creates a draft, uploads, then publishes, which immutable releases
      # need. A release that is already published (a re-run after a later step
      # failed) is kept, and the appcast is regenerated from its zip: the one
      # this run built is signed differently, and an appcast describing it
      # would make Sparkle reject the published download. A draft left by an
      # interrupted upload is redone.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATE="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$STATE" in
            false)
              echo "Release $GITHUB_REF_NAME is already published; keeping it and describing its zip in the appcast"
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --pattern "Clicker-$VERSION.zip" --dir dist/release --clobber
              script/release.sh --version "$VERSION" --appcast-only
              exit 0
              ;;
            true)
              echo "Replacing the draft release left by an earlier run"
              gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "dist/release/Clicker-$VERSION.dmg" "dist/release/Clicker-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Clicker $VERSION" --notes-file dist/release/notes.md

      # Only after the release is live, so the feed never points at a missing zip.
      - name: Push the appcast to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/gh-pages" origin/gh-pages
          cp dist/release/appcast.xml "$RUNNER_TEMP/gh-pages/appcast.xml"
          cd "$RUNNER_TEMP/gh-pages"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "Appcast on gh-pages is already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Appcast for $GITHUB_REF_NAME"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      # The cask installs the published DMG, so it takes that file's digest
      # from GitHub rather than hashing dist/release, which a re-run rebuilds.
      # HOMEBREW_TAP_TOKEN is a fine-grained token with Contents read and write
      # on the tap only. Optional: without it the cask stays behind, which
      # matters little since it says auto_updates and Sparkle takes over.
      - name: Bump the Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the cask is not bumped"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          DIGEST="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name == \"Clicker-$VERSION.dmg\") | .digest")"
          SHA256="${DIGEST#sha256:}"
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "no sha256 digest for Clicker-$VERSION.dmg: ${DIGEST:-none}" >&2
            exit 1
          fi
          git clone --quiet --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/jakejarvis/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          # The whole cask lives here so a change to what it installs or zaps
          # ships with the release that needs it; edits made in the tap are
          # overwritten.
          cat > Casks/clicker.rb <<EOF
          # Written by the release workflow in jakejarvis/Clicker; edit it there.
          cask "clicker" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/jakejarvis/Clicker/releases/download/v#{version}/Clicker-#{version}.dmg"
            name "Clicker"
            desc "Menu bar remote for Apple TV"
            homepage "https://clicker.jarv.is/"

            livecheck do
              url "https://clicker.jarv.is/appcast.xml"
              strategy :sparkle, &:short_version
            end

            auto_updates true
            depends_on macos: :sequoia

            app "Clicker.app"

            uninstall quit: "com.jakejarvis.Clicker"

            zap trash: [
              "~/Library/Application Scripts/com.jakejarvis.Clicker",
              "~/Library/Containers/com.jakejarvis.Clicker",
            ]
          end
          EOF
          # The runner image ships Homebrew; lint before anything is pushed.
          if command -v brew >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew style Casks/clicker.rb
          else
            echo "::warning::brew is not installed; Casks/clicker.rb was not linted"
          fi
          if git diff --quiet; then
            echo "Cask is already at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -am "Clicker $VERSION"
          git push --quiet origin HEAD

      # The site's download button and changelog are built from the GitHub
      # releases API at deploy time, so a deploy hook (Vercel project settings ›
      # Git › Deploy Hooks) refreshes them. Optional: without the secret the next push to main does.
      - name: Redeploy the site
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$VERCEL_DEPLOY_HOOK_URL" ]]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set; the site refreshes on the next deploy"
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" >/dev/null
          echo "Site deploy requested"

      # The Mac App Store build goes to App Store Connect, where it shows up in
      # TestFlight once processed; submitting it for review stays a click there.
      # Last, since package_app.sh replaces dist/Clicker.app and a failure here
      # should leave everything above published. Optional: without
      # APP_STORE_P12_BASE64 nothing is uploaded. A re-run finds the build
      # already uploaded and counts that as done.
      - name: Upload the App Store build
        env:
          APP_STORE_P12_BASE64: ${{ secrets.APP_STORE_P12_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [[ -z "$APP_STORE_P12_BASE64" ]]; then
            echo "APP_STORE_P12_BASE64 is not set; no App Store build is uploaded"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          script/package_app.sh --release --universal --app-store --version "$VERSION" \
            --sign "$APP_STORE_IDENTITY" --installer "$APP_STORE_INSTALLER_IDENTITY"
          BUILD="$(plutil -extract CFBundleVersion raw dist/Clicker.app/Contents/Info.plist)"
          # altool finds the key by its file name, AuthKey_<id>.p8.
          mkdir -p "$RUNNER_TEMP/private_keys"
          cp "$ASC_KEY_PATH" "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          # The long form of --upload-package and the camelCase key flags are
          # what Xcode 26's altool documents; Xcode 27's accepts them too.
          set +e
          OUTPUT="$(API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" xcrun altool \
            --upload-package dist/Clicker.pkg --type macos --apple-id "$APP_STORE_APPLE_ID" \
            --bundle-id com.jakejarvis.Clicker --bundle-version "$BUILD" \
            --bundle-short-version-string "$VERSION" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          # An ERROR line counts as a failure even if altool exits 0.
          if [[ $STATUS -eq 0 ]] && ! grep -q 'ERROR:' <<<"$OUTPUT"; then
            exit 0
          fi
          # Only a duplicate of this very build counts as done. "Must be higher"
          # alone can mean a later build is already there, which would leave
          # this version without one, so that stays a failure.
          if grep -qE 'Redundant Binary Upload|has already been used|DUPLICATE' <<<"$OUTPUT"; then
            echo "Build $BUILD of $VERSION is already in App Store Connect"
            exit 0
          fi
          exit 1

      # notarytool's log and whatever was built, for reading a rejected
      # submission or a failed verification without re-running the job.
      - name: Keep the release files for debugging
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/release
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          rm -rf "$RUNNER_TEMP/private_keys"
