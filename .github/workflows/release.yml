# Pushing a vX.Y.Z tag builds a universal, Developer ID-signed and notarized
# Clicker, publishes the DMG and zip as a GitHub release, then pushes the
# Sparkle appcast to the gh-pages branch (served at clicker.jarv.is/appcast.xml
# through the Vercel rewrite in site/vercel.json). Notes come from the
# annotated tag's message.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIGNING_IDENTITY: "Developer ID Application: Jake Jarvis (B5ZWKBCUTU)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actions/checkout can leave the tag lightweight; the notes need its message.
      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - name: Import signing credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$ASC_API_KEY_P8" >"$RUNNER_TEMP/AuthKey.p8"
          echo "KEYCHAIN=$KEYCHAIN" >>"$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >>"$GITHUB_ENV"

      - name: Build, sign, notarize and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: script/release.sh --version "${GITHUB_REF_NAME#v}"

      # gh creates a draft, uploads, then publishes, which immutable releases need.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/release/Clicker-$VERSION.dmg" "dist/release/Clicker-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Clicker $VERSION" --notes-file dist/release/notes.md

      # Only after the release is live, so the feed never points at a missing zip.
      - name: Push the appcast to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/gh-pages" FETCH_HEAD
          cp dist/release/appcast.xml "$RUNNER_TEMP/gh-pages/appcast.xml"
          cd "$RUNNER_TEMP/gh-pages"
          git add appcast.xml
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Appcast for $GITHUB_REF_NAME"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
